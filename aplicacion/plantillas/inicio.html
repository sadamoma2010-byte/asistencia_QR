<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAD - Sistema de Asistencia Docente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4CB;</text></svg>">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--indigo:#6366f1;--indigo-dk:#4f46e5;--indigo-dp:#4338ca}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;overflow-x:hidden;color:#1e293b;background:#f8fafc}

    /* AURORA */
    .aurora{position:fixed;inset:0;z-index:0;
      background:
        radial-gradient(ellipse 120% 80% at 20% 0%,rgba(196,181,253,.45) 0%,transparent 55%),
        radial-gradient(ellipse 100% 70% at 80% 100%,rgba(153,246,228,.4) 0%,transparent 55%),
        radial-gradient(ellipse 80% 60% at 50% 50%,rgba(255,255,255,1) 0%,transparent 80%),
        linear-gradient(160deg,#faf5ff 0%,#fff 35%,#f0fdfa 70%,#ecfeff 100%)}
    .aurora::before,.aurora::after{content:'';position:absolute;border-radius:50%;filter:blur(100px)}
    .aurora::before{width:700px;height:700px;top:-30%;left:-10%;background:radial-gradient(circle,rgba(167,139,250,.3),transparent 70%);animation:drift 20s ease-in-out infinite}
    .aurora::after{width:600px;height:600px;bottom:-25%;right:-5%;background:radial-gradient(circle,rgba(94,234,212,.25),transparent 70%);animation:drift 20s ease-in-out infinite reverse}
    @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.05)}66%{transform:translate(-20px,20px) scale(.97)}}

    /* NAVBAR */
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:rgba(255,255,255,.6);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.6)}
    .nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
    .nav-logo-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--indigo),var(--indigo-dp));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(99,102,241,.3)}
    .nav-logo-ic svg{width:20px;height:20px;color:#fff}
    .nav-logo-t{font-size:18px;font-weight:800;color:#1e293b;letter-spacing:-.02em}
    .nav-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 28px;border-radius:9999px;font-size:14px;font-weight:600;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--indigo),var(--indigo-dp));box-shadow:0 4px 20px rgba(99,102,241,.3);transition:all .3s;border:none;cursor:pointer}
    .nav-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,.4)}
    .nav-btn svg{width:16px;height:16px}

    /* MAIN */
    .main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:120px 24px 60px}
    .content{max-width:900px;width:100%;text-align:center}

    /* BADGE */
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 20px;border-radius:9999px;background:rgba(255,255,255,.6);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);font-size:12px;font-weight:500;color:#64748b;letter-spacing:.04em;margin-bottom:32px;animation:fadeUp .6s ease-out both}
    .badge-dot{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pd 2s ease-in-out infinite}
    @keyframes pd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

    /* HERO */
    .hero-t{font-size:clamp(40px,7vw,80px);font-weight:900;line-height:1.05;letter-spacing:-.03em;color:#1e293b;animation:fadeUp .6s ease-out .1s both}
    .hero-t span{display:block;background:linear-gradient(135deg,var(--indigo) 0%,#7c3aed 50%,var(--indigo-dp) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero-s{margin-top:24px;font-size:18px;font-weight:400;color:#64748b;line-height:1.7;max-width:520px;margin-left:auto;margin-right:auto;animation:fadeUp .6s ease-out .2s both}
    .hero-s strong{color:#334155;font-weight:600}

    /* CTA */
    .cta-w{margin-top:40px;animation:fadeUp .6s ease-out .3s both}
    .cta-b{display:inline-flex;align-items:center;gap:10px;padding:16px 40px;border-radius:9999px;font-size:16px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--indigo),var(--indigo-dp));box-shadow:0 4px 24px rgba(99,102,241,.35);transition:all .35s cubic-bezier(.4,0,.2,1);border:none;cursor:pointer}
    .cta-b:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 40px rgba(99,102,241,.45),0 0 0 8px rgba(99,102,241,.08)}
    .cta-b:active{transform:translateY(-1px) scale(1)}
    .cta-b svg{width:20px;height:20px}

    /* CARDS */
    .cards{margin-top:64px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;animation:fadeUp .7s ease-out .45s both}
    .card{background:rgba(255,255,255,.6);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:28px 16px;text-align:center;transition:all .4s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 4px 24px rgba(0,0,0,.03),0 1px 4px rgba(0,0,0,.02),inset 0 1px 0 rgba(255,255,255,.9)}
    .card:hover{transform:translateY(-10px);box-shadow:0 24px 60px rgba(99,102,241,.1),0 8px 20px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,1)}
    .card-ic{width:48px;height:48px;margin:0 auto;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(99,102,241,.08);transition:all .3s}
    .card:hover .card-ic{background:rgba(99,102,241,.14);transform:scale(1.08)}
    .card-ic svg{width:22px;height:22px;color:var(--indigo)}
    .card-lb{margin-top:14px;font-size:13px;font-weight:500;color:#94a3b8}
    .card-nm{margin-top:6px;font-size:42px;font-weight:900;color:var(--indigo);letter-spacing:-.03em;line-height:1}

    /* PILL */
    .pill-w{margin-top:48px;animation:fadeUp .7s ease-out .6s both}
    .pill{display:inline-flex;align-items:center;gap:40px;padding:20px 48px;border-radius:9999px;background:rgba(255,255,255,.5);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 24px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.8)}
    .pill-it{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;transition:all .3s}
    .pill-it:hover{transform:translateY(-2px)}
    .pill-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;transition:all .3s}
    .pill-it:hover .pill-ic{background:rgba(99,102,241,.1)}
    .pill-ic svg{width:20px;height:20px;color:#475569}
    .pill-it:hover .pill-ic svg{color:var(--indigo)}
    .pill-lb{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em}

    /* FOOTER */
    .footer{position:relative;z-index:1;padding:40px 24px;text-align:center}
    .footer p{font-size:12px;color:#cbd5e1}

    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

    @media(max-width:768px){.nav{padding:0 20px}.cards{grid-template-columns:repeat(2,1fr);gap:14px}.pill{gap:24px;padding:18px 28px}.hero-t{font-size:clamp(32px,8vw,56px)}}
    @media(max-width:480px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:20px 12px;border-radius:16px}.card-nm{font-size:32px}.pill{gap:16px;padding:16px 20px}.pill-lb{font-size:9px}}
  </style>
</head>
