services:
  - type: web
    name: asistencia-qr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py || true
    startCommand: python servidor.py --produccion
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: SEED_ADMIN_EMAIL
        value: admin@datly.local
      - key: DATABASE_URL
        fromDatabase:
          name: asistencia-qr-db
          property: connectionString

databases:
  - name: asistencia-qr-db
    plan: free
    databaseName: asistencia_qr
    user: postgres
