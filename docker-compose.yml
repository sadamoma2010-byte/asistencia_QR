services:
  postgres:
    image: postgres:16-alpine
    container_name: asistencia_qr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asistencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_contrasena}
      POSTGRES_DB: ${POSTGRES_DB:-asistencia_qr}
      # Ordenación y comparación adecuadas para español
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta solo la primera vez, cuando el volumen está vacío
      - ./database.sql:/docker-entrypoint-initdb.d/01-estructura.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-asistencia} -d ${POSTGRES_DB:-asistencia_qr}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - asistencia_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: asistencia_qr_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistencia}:${POSTGRES_PASSWORD:-cambiar_esta_contrasena}@postgres:5432/${POSTGRES_DB:-asistencia_qr}?schema=public
      API_PORT: 4000
      API_PREFIX: ${API_PREFIX:-api/v1}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-cambiar-en-produccion-access-secret-min-32-chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambiar-en-produccion-refresh-secret-min-32-chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      LOGIN_RATE_TTL: ${LOGIN_RATE_TTL:-60}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@datly.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123*}
    ports:
      - '4000:4000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:4000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - asistencia_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: asistencia_qr_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Sistema de Asistencia Docente}
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - asistencia_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  asistencia_net:
    driver: bridge
