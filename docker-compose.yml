services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asistencia_qr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/asistencia_qr
      NODE_ENV: production
      API_PORT: "4000"
      API_PREFIX: api/v1
      JWT_ACCESS_SECRET: docker-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: docker-refresh-secret-min-32-chars!!
      SESSION_SECRET: docker-session-secret-min-32-chars!!
      BCRYPT_ROUNDS: "12"
      APP_TIMEZONE: America/Bogota
      SEED_ADMIN_EMAIL: admin@datly.local
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
